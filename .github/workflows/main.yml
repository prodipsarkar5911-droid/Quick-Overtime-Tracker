name: Build Python App

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        # আপনার কোনো ডিপেনডেন্সি থাকলে নিচে যুক্ত করুন, যেমন:
        # pip install pyinstaller

    - name: Run Script Test
      run: |
        python -m py_compile main.py  # আপনার মেইন পাইথন ফাইলের নাম দিন
